# main -> pre-release vX.Y.Z-dev.N; tag vX.Y.Z (= Cargo version) -> release vX.Y.Z. See README.md.
# Build (scripts/dist.sh) + gating tests -> GitHub release; skipped if already released; GHCR images never block.
name: release

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions: {}

concurrency:
  # Serialized per ref (a newer queued main push supersedes an older one); tag runs are never cancelled by main.
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

defaults:
  run:
    shell: bash # -eo pipefail

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.K10S_BUILD_VERSION }}
      build: ${{ steps.v.outputs.K10S_BUILD_COMMIT }}
      full: ${{ steps.v.outputs.K10S_VERSION_FULL }}
      tag: ${{ steps.v.outputs.K10S_VERSION_TAG }}
      channel: ${{ steps.v.outputs.K10S_CHANNEL }}
      released: ${{ steps.state.outputs.released }}
      publish: ${{ steps.state.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # build number = commit count; tags decide stable vs dev
          persist-credentials: false
      - name: Compute the version
        id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ $REF_TYPE == tag ]]; then
            mode=--stable
            base=$(scripts/version.sh --base)
            if [[ $REF_NAME != "v$base" ]]; then
              echo "::error::tag $REF_NAME does not match the Cargo workspace version $base (Cargo.toml and metal/Cargo.toml)"
              exit 1
            fi
          else
            mode=--dev
          fi
          scripts/version.sh "$mode" --strict --env | tee -a "$GITHUB_OUTPUT"
      - name: Already released?
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.K10S_VERSION_TAG }}
          CHANNEL: ${{ steps.v.outputs.K10S_CHANNEL }}
        run: |
          released=false
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::release $TAG already exists: nothing to do"
            released=true
          elif [[ $CHANNEL == dev ]] && git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "::notice::tag $TAG already exists: nothing to do"
            released=true
          fi
          publish=false
          if [[ $released == false && ( $GITHUB_REF == refs/heads/main || $GITHUB_REF == refs/tags/v* ) ]]; then
            publish=true
          elif [[ $released == false ]]; then
            echo "::notice::$GITHUB_REF: build and test only (releases come from main and from tags vX.Y.Z)"
          fi
          echo "released=$released" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  build:
    name: Build artifacts
    needs: version
    if: needs.version.outputs.released == 'false'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      # One version for every binary of the run.
      K10S_BUILD_VERSION: ${{ needs.version.outputs.version }}
      K10S_BUILD_COMMIT: ${{ needs.version.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/toolchains
        with:
          go: "true"
      - name: scripts/dist.sh
        run: scripts/dist.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  test:
    name: Tests (${{ matrix.suite }})
    needs: version
    if: needs.version.outputs.released == 'false'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Chaos/soak campaigns run in ci.yml, non-blocking.
        suite: [unit, musl]
    env:
      K10S_BUILD_VERSION: ${{ needs.version.outputs.version }}
      K10S_BUILD_COMMIT: ${{ needs.version.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchains
      - name: scripts/ci-test.sh ${{ matrix.suite }}
        run: scripts/ci-test.sh "$SUITE"
        env:
          SUITE: ${{ matrix.suite }}

  metal:
    name: Bare-metal kernel self tests (QEMU/KVM)
    needs: version
    if: needs.version.outputs.released == 'false'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      K10S_BUILD_VERSION: ${{ needs.version.outputs.version }}
      K10S_BUILD_COMMIT: ${{ needs.version.outputs.build }}
      K10S_VERSION_FULL: ${{ needs.version.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchains
        with:
          qemu: "true"
      - name: scripts/ci-test.sh metal-selftest
        run: scripts/ci-test.sh metal-selftest

  metal-e2e:
    name: Bare-metal kernel end-to-end (metal/test.sh, non-blocking)
    needs: version
    if: needs.version.outputs.released == 'false'
    # Not a gate: one check bounds latency under a CPU-hog storm, which nested virtualization may exceed.
    continue-on-error: true
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      K10S_BUILD_VERSION: ${{ needs.version.outputs.version }}
      K10S_BUILD_COMMIT: ${{ needs.version.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchains
        with:
          go: "true"
          qemu: "true"
      - name: scripts/ci-test.sh metal
        run: scripts/ci-test.sh metal

  publish:
    name: Publish ${{ needs.version.outputs.tag }}
    needs: [version, build, test, metal]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
      CHANNEL: ${{ needs.version.outputs.channel }}
      KEEP_DEV_RELEASES: "10"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # release notes need history and tags
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Verify the artifacts
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          ls -l
      - name: Release notes
        run: scripts/release-notes.sh "$TAG" "$GITHUB_SHA" | tee "$RUNNER_TEMP/notes.md"
      - name: Create the release
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::release $TAG already exists: not publishing"
            exit 0
          fi
          args=(--repo "$GITHUB_REPOSITORY" --title "k10s $VERSION" --notes-file "$RUNNER_TEMP/notes.md")
          if [[ $CHANNEL == dev ]]; then
            # Pre-releases never become "latest".
            args+=(--prerelease --target "$GITHUB_SHA")
          else
            args+=(--verify-tag)
          fi
          gh release create "$TAG" "${args[@]}" dist/*.tar.gz dist/SHA256SUMS
      - name: Prune old development pre-releases
        if: needs.version.outputs.channel == 'dev'
        run: |
          # Keep the newest $KEEP_DEV_RELEASES dev pre-releases (by N); delete older ones and their tags.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName,isPrerelease --jq '
            [.[] | select(.isPrerelease and (.tagName | test("^v[0-9]+[.][0-9]+[.][0-9]+-dev[.][0-9]+$")))]
            | sort_by(.tagName | capture("-dev[.](?<n>[0-9]+)$").n | tonumber) | reverse
            | .[(env.KEEP_DEV_RELEASES | tonumber):] | .[].tagName' |
          while read -r old; do
            echo "deleting pre-release $old"
            gh release delete "$old" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done

  images:
    name: Benchmark images (GHCR)
    needs: [version, publish]
    # Runs after the release and may fail without affecting it.
    continue-on-error: true
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CHANNEL: ${{ needs.version.outputs.channel }}
      K10S_VERSION_FULL: ${{ needs.version.outputs.full }}
      K10S_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Build and push ghcr.io/<owner>/k10s-bench-<workload>
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -xzf "dist/k10s-bench-$VERSION-linux-amd64.tar.gz" -C "$RUNNER_TEMP"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          owner=${GITHUB_REPOSITORY_OWNER,,}
          # Docker tags cannot hold `+build`: version without it, plus a moving tag.
          moving=dev
          if [[ $CHANNEL == stable ]]; then moving=latest; fi
          scripts/bench-images.sh "$RUNNER_TEMP/k10s-bench-$VERSION-linux-amd64" "ghcr.io/$owner/k10s-bench-" "$VERSION" "$moving" --push
