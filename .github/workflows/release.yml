# main -> pre-release vX.Y.Z-dev.N; tag vX.Y.Z (= Cargo version, on main) -> release vX.Y.Z. See README.md.
# Build (scripts/dist.sh) + gating tests -> attested release; skipped if already released; GHCR images never block.
name: release

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions: {}

concurrency:
  # Serialized per ref (a newer queued main push supersedes an older one); tag runs are never cancelled by main.
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

defaults:
  run:
    shell: bash # -eo pipefail

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.K10S_BUILD_VERSION }}
      build: ${{ steps.v.outputs.K10S_BUILD_COMMIT }}
      full: ${{ steps.v.outputs.K10S_VERSION_FULL }}
      tag: ${{ steps.v.outputs.K10S_VERSION_TAG }}
      channel: ${{ steps.v.outputs.K10S_CHANNEL }}
      released: ${{ steps.state.outputs.released }}
      publish: ${{ steps.state.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # build number = commit count; tags decide stable vs dev
          persist-credentials: false
      - name: Compute the version
        id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          base=$(scripts/version.sh --base)
          mode=--dev
          if [[ $REF_TYPE == tag ]]; then
            if [[ $REF_NAME != "v$base" ]]; then
              echo "::error::tag $REF_NAME does not match the Cargo workspace version $base"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::tag $REF_NAME is not on main"
              exit 1
            fi
            mode=--stable
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          scripts/version.sh "$mode" --strict --env | tee -a "$GITHUB_OUTPUT"
      - name: Publish?
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.K10S_VERSION_TAG }}
          CHANNEL: ${{ steps.v.outputs.K10S_CHANNEL }}
          BASE: ${{ steps.v.outputs.base }}
        run: |
          state=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft \
            --jq 'if .isDraft then "draft" else "published" end' 2> /dev/null || echo none)
          tagged=$(git rev-parse -q --verify "refs/tags/$TAG^{commit}" || true)
          released=false
          publish=false
          if [[ -n $tagged && $tagged != "$GITHUB_SHA" ]]; then
            echo "::error::tag $TAG already exists on $tagged, not on $GITHUB_SHA"
            exit 1
          elif [[ $state == published ]]; then
            echo "::notice::$TAG is already released"
            released=true
          elif [[ $CHANNEL == stable ]]; then
            publish=true
          elif [[ $GITHUB_REF != refs/heads/main ]]; then
            echo "::notice::$GITHUB_REF: build and test only"
          elif [[ $(git rev-parse origin/main) != "$GITHUB_SHA" ]]; then
            echo "::notice::main has moved past $GITHUB_SHA: build and test only"
          elif [[ $(git rev-parse -q --verify "refs/tags/v$BASE^{commit}" || true) == "$GITHUB_SHA" ]]; then
            echo "::notice::$GITHUB_SHA is the stable release v$BASE: no dev pre-release"
          else
            publish=true
          fi
          echo "released=$released" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  build:
    name: Build artifacts
    needs: version
    if: needs.version.outputs.released == 'false'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      K10S_BUILD_VERSION: ${{ needs.version.outputs.version }}
      K10S_BUILD_COMMIT: ${{ needs.version.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/toolchains
        with:
          go: "true"
          cross-arm64: "true"
      - name: scripts/dist.sh
        run: scripts/dist.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  dist-test:
    name: Tests of the release binary (dist, musl)
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      K10S_BUILD_VERSION: ${{ needs.version.outputs.version }}
      K10S_BUILD_COMMIT: ${{ needs.version.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchains
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: scripts/ci-test.sh dist
        run: scripts/ci-test.sh dist

  test:
    name: Tests (${{ matrix.suite }})
    needs: version
    if: needs.version.outputs.released == 'false'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, musl] # chaos/soak campaigns: ci.yml, non-blocking
    env:
      K10S_BUILD_VERSION: ${{ needs.version.outputs.version }}
      K10S_BUILD_COMMIT: ${{ needs.version.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchains
      - name: scripts/ci-test.sh ${{ matrix.suite }}
        run: scripts/ci-test.sh "$SUITE"
        env:
          SUITE: ${{ matrix.suite }}

  arm64:
    name: Tests on arm64 (interpreter, gnu and musl)
    needs: version
    if: needs.version.outputs.released == 'false'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    env:
      K10S_BUILD_VERSION: ${{ needs.version.outputs.version }}
      K10S_BUILD_COMMIT: ${{ needs.version.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchains
      - name: scripts/ci-test.sh arm64
        run: scripts/ci-test.sh arm64
  metal:
    name: Bare-metal kernel self tests (QEMU/KVM)
    needs: version
    if: needs.version.outputs.released == 'false'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      K10S_BUILD_VERSION: ${{ needs.version.outputs.version }}
      K10S_BUILD_COMMIT: ${{ needs.version.outputs.build }}
      K10S_VERSION_FULL: ${{ needs.version.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchains
        with:
          qemu: "true"
      - name: scripts/ci-test.sh metal-selftest
        run: scripts/ci-test.sh metal-selftest

  os:
    name: PID 1 mode and disk images under QEMU/KVM (os/test.sh)
    needs: [version, build]
    if: needs.version.outputs.released == 'false'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      K10S_BUILD_VERSION: ${{ needs.version.outputs.version }}
      K10S_BUILD_COMMIT: ${{ needs.version.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchains
        with:
          qemu: "true"
      - name: Kernel build and image tools
        run: >-
          sudo apt-get install -y -q --no-install-recommends flex bison bc libelf-dev libssl-dev dosfstools mtools fdisk
          zstd xz-utils ovmf libdevmapper1.02.1
      - name: Secure Boot test tools (os/test.sh secureboot)
        run: sudo apt-get install -y -q --no-install-recommends sbsigntool python3-virt-firmware
      # The pinned downloads (kernel.org tarball, Debian packages, firmware) and the k10s kernels built from them.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/os/linux-*.tar.xz
            target/os/*.deb
            target/os/firmware-*
            target/os/kernel-x86_64-*/arch/x86/boot/bzImage
            target/os/kernel-x86_64-*/modroot
            target/os/kernel-x86_64-*/.k10s-stamp
          key: os-${{ hashFiles('os/kbuild.sh', 'os/debian-kernel.sh', 'os/bootfiles.sh', 'os/firmware.sh', 'os/firmware.list', 'os/kconfig/*') }}
      # The images ship and the tests use the k10s of the release's musl archive.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: The release's k10s
        run: |
          tar -xzf dist/k10s-*-x86_64-unknown-linux-musl.tar.gz -C "$RUNNER_TEMP"
          echo "K10S_BIN=$(echo "$RUNNER_TEMP"/k10s-*-x86_64-unknown-linux-musl/k10s)" >> "$GITHUB_ENV"
      # The release key signs the images (os/images.sh); its public half is os/release-key.pub, built into k10s.
      - name: The OS image signing key
        env:
          IMAGE_KEY: ${{ secrets.K10S_IMAGE_KEY }}
        run: |
          if [[ -z $IMAGE_KEY ]]; then
            echo "::error::the repository secret K10S_IMAGE_KEY (the OS image signing key) is not set"
            exit 1
          fi
          (umask 077 && printf '%s\n' "$IMAGE_KEY" >"$RUNNER_TEMP/image.key")
          echo "K10S_IMAGE_KEY=$RUNNER_TEMP/image.key" >>"$GITHUB_ENV"
      - name: scripts/ci-test.sh os
        run: scripts/ci-test.sh os
      - name: The images verify against the release key built into k10s
        run: for f in target/os/images/*.efi; do "$K10S_BIN" image verify "$f"; done
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/image.key"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: os-images
          path: target/os/images/
          if-no-files-found: error
          retention-days: 14

  os-arm64:
    name: arm64 kernel, aarch64-vm and Pi images under QEMU (os/test.sh --arch aarch64)
    needs: [version, build]
    if: needs.version.outputs.released == 'false'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      K10S_BUILD_VERSION: ${{ needs.version.outputs.version }}
      K10S_BUILD_COMMIT: ${{ needs.version.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchains
        with:
          qemu: "true"
          cross-arm64: "true"
          qemu-arm64: "true"
      - name: Kernel build and image tools
        run: >-
          sudo apt-get install -y -q --no-install-recommends flex bison bc libelf-dev libssl-dev dosfstools mtools fdisk
          zstd xz-utils libdevmapper1.02.1
      - name: Secure Boot test tools (os/test.sh secureboot-arm64)
        run: sudo apt-get install -y -q --no-install-recommends sbsigntool python3-virt-firmware
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/os/linux-*.tar.xz
            target/os/*.deb
            target/os/kernel-aarch64/arch/arm64/boot/Image
            target/os/kernel-aarch64/arch/arm64/boot/Image.gz
            target/os/kernel-aarch64/arch/arm64/boot/dts/broadcom/*.dtb
            target/os/kernel-aarch64/.k10s-stamp
          key: os-arm64-${{ hashFiles('os/kbuild.sh', 'os/bootfiles.sh', 'os/kpatches/*', 'os/kconfig/*') }}
      # The images ship the k10s of the release's aarch64 musl archive; the host runs the x86-64 one.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: The release's k10s
        run: |
          for t in aarch64 x86_64; do tar -xzf dist/k10s-*-$t-unknown-linux-musl.tar.gz -C "$RUNNER_TEMP"; done
          echo "K10S_BIN=$(echo "$RUNNER_TEMP"/k10s-*-aarch64-unknown-linux-musl/k10s)" >> "$GITHUB_ENV"
          echo "K10S_HOST_BIN=$(echo "$RUNNER_TEMP"/k10s-*-x86_64-unknown-linux-musl/k10s)" >> "$GITHUB_ENV"
      - name: The OS image signing key
        env:
          IMAGE_KEY: ${{ secrets.K10S_IMAGE_KEY }}
        run: |
          if [[ -z $IMAGE_KEY ]]; then
            echo "::error::the repository secret K10S_IMAGE_KEY (the OS image signing key) is not set"
            exit 1
          fi
          (umask 077 && printf '%s\n' "$IMAGE_KEY" >"$RUNNER_TEMP/image.key")
          echo "K10S_IMAGE_KEY=$RUNNER_TEMP/image.key" >>"$GITHUB_ENV"
      - name: scripts/ci-test.sh os-arm64
        run: scripts/ci-test.sh os-arm64
      - name: The images verify against the release key built into k10s
        run: for f in target/os/images/*-aarch64-vm.efi target/os/images/*-aarch64-pi.fat; do "$K10S_HOST_BIN" image verify "$f"; done
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/image.key"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: os-images-arm64
          path: target/os/images/
          if-no-files-found: error
          retention-days: 14

  metal-e2e:
    name: Bare-metal kernel end-to-end (metal/test.sh, non-blocking)
    needs: version
    if: needs.version.outputs.released == 'false'
    # Not a gate: one check bounds latency under a CPU-hog storm, which nested virtualization may exceed.
    continue-on-error: true
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      K10S_BUILD_VERSION: ${{ needs.version.outputs.version }}
      K10S_BUILD_COMMIT: ${{ needs.version.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchains
        with:
          go: "true"
          qemu: "true"
      - name: scripts/ci-test.sh metal
        run: scripts/ci-test.sh metal

  publish:
    name: Publish ${{ needs.version.outputs.tag }}
    needs: [version, build, dist-test, test, arm64, metal, os, os-arm64]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
      CHANNEL: ${{ needs.version.outputs.channel }}
      KEEP_DEV_RELEASES: "10"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # release notes need history and tags
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: os-images
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: os-images-arm64
          path: dist
      - name: Verify the artifacts
        working-directory: dist
        run: |
          cat SHA256SUMS.os-* >>SHA256SUMS && rm SHA256SUMS.os-*
          sha256sum -c SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Release notes
        run: |
          RELEASE_TAGS=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1000 \
            --json tagName --jq '.[].tagName') scripts/release-notes.sh "$TAG" "$GITHUB_SHA" | tee "$RUNNER_TEMP/notes.md"
      - name: Create the release
        run: |
          # Drafts left by an interrupted asset upload.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.draft and .tag_name == env.TAG) | .id' |
            while read -r id; do
              echo "deleting orphan draft release $id"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
            done
          latest=false
          args=(--repo "$GITHUB_REPOSITORY" --title "k10s $VERSION" --notes-file "$RUNNER_TEMP/notes.md")
          if [[ $CHANNEL == dev ]]; then
            args+=(--prerelease --target "$GITHUB_SHA")
          else
            top=$( (gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1000 \
              --json tagName --jq '.[].tagName' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true
              echo "$TAG") | sort -V | tail -1)
            if [[ $top == "$TAG" ]]; then latest=true; fi
            args+=(--verify-tag)
          fi
          gh release create "$TAG" "${args[@]}" --latest="$latest" dist/*.tar.gz dist/*.img.xz dist/*.efi \
            dist/*.fat dist/SHA256SUMS
      - name: Prune old development pre-releases
        if: needs.version.outputs.channel == 'dev'
        run: scripts/prune-dev.sh "$KEEP_DEV_RELEASES" releases

  images:
    name: Benchmark images (GHCR)
    needs: [version, publish]
    continue-on-error: true
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
      CHANNEL: ${{ needs.version.outputs.channel }}
      K10S_VERSION_FULL: ${{ needs.version.outputs.full }}
      K10S_REVISION: ${{ github.sha }}
      KEEP_DEV_IMAGES: "10"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Build and push ghcr.io/<owner>/k10s-bench-<workload>
        run: |
          tar -xzf "dist/k10s-bench-$VERSION-linux-amd64.tar.gz" -C "$RUNNER_TEMP"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # Moving tags follow the releases as they are now: a re-run of an older build never moves them backwards.
          tags=("$VERSION")
          if [[ $CHANNEL == dev ]]; then
            newest=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1000 --json tagName --jq '.[].tagName' |
              sed -nE 's/^v[0-9]+\.[0-9]+\.[0-9]+-dev\.([0-9]+)$/\1 &/p' | sort -k1,1n | tail -1)
            if [[ ${newest#* } == "$TAG" ]]; then tags+=(dev); fi
          else
            latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
            if [[ $latest == "$TAG" ]]; then tags+=(latest); fi
          fi
          prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/k10s-bench-
          scripts/bench-images.sh "$RUNNER_TEMP/k10s-bench-$VERSION-linux-amd64" "$prefix" "${tags[@]}" --push |
            tee "$RUNNER_TEMP/images.sha256"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/images.sha256
      - name: Prune old development images
        if: needs.version.outputs.channel == 'dev'
        run: |
          scripts/prune-dev.sh "$KEEP_DEV_IMAGES" images \
            k10s-bench-echo k10s-bench-compute k10s-bench-chain k10s-bench-counter
