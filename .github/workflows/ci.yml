# Pull requests: the builds and tests of release.yml, no publishing. On main only the non-blocking chaos/soak campaigns.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Tests (${{ matrix.suite }})
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, musl]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the build scripts derive the version from history
          persist-credentials: false
      - uses: ./.github/actions/toolchains
      - name: scripts/ci-test.sh ${{ matrix.suite }}
        run: scripts/ci-test.sh "$SUITE"
        env:
          SUITE: ${{ matrix.suite }}

  arm64:
    name: Tests on arm64 (interpreter, gnu and musl)
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/toolchains
      - name: scripts/ci-test.sh arm64
        run: scripts/ci-test.sh arm64

  metal:
    name: Bare-metal kernel self tests (QEMU/KVM)
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/toolchains
        with:
          qemu: "true"
      - name: scripts/ci-test.sh metal-selftest
        run: scripts/ci-test.sh metal-selftest

  os:
    name: PID 1 mode and disk images under QEMU/KVM (os/test.sh)
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/toolchains
        with:
          qemu: "true"
      - name: Kernel build and image tools
        run: >-
          sudo apt-get install -y -q --no-install-recommends flex bison bc libelf-dev libssl-dev dosfstools mtools fdisk
          zstd xz-utils ovmf libdevmapper1.02.1
      - name: Secure Boot test tools (os/test.sh secureboot)
        run: sudo apt-get install -y -q --no-install-recommends sbsigntool python3-virt-firmware
      # The pinned downloads (kernel.org tarball, Debian packages, firmware) and the k10s kernels built from them.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/os/linux-*.tar.xz
            target/os/*.deb
            target/os/firmware-*
            target/os/kernel-x86_64-*/arch/x86/boot/bzImage
            target/os/kernel-x86_64-*/modroot
            target/os/kernel-x86_64-*/.k10s-stamp
          key: os-${{ hashFiles('os/kbuild.sh', 'os/debian-kernel.sh', 'os/bootfiles.sh', 'os/firmware.sh', 'os/firmware.list', 'os/kconfig/*') }}
      - name: scripts/ci-test.sh os
        run: scripts/ci-test.sh os

  os-arm64:
    name: arm64 kernel, aarch64-vm and Pi images under QEMU (os/test.sh --arch aarch64)
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/toolchains
        with:
          qemu: "true"
          cross-arm64: "true"
          qemu-arm64: "true"
      - name: Kernel build and image tools
        run: >-
          sudo apt-get install -y -q --no-install-recommends flex bison bc libelf-dev libssl-dev dosfstools mtools fdisk
          zstd xz-utils libdevmapper1.02.1
      - name: Secure Boot test tools (os/test.sh secureboot-arm64)
        run: sudo apt-get install -y -q --no-install-recommends sbsigntool python3-virt-firmware
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/os/linux-*.tar.xz
            target/os/*.deb
            target/os/kernel-aarch64/arch/arm64/boot/Image
            target/os/kernel-aarch64/arch/arm64/boot/Image.gz
            target/os/kernel-aarch64/arch/arm64/boot/dts/broadcom/*.dtb
            target/os/kernel-aarch64/.k10s-stamp
          key: os-arm64-${{ hashFiles('os/kbuild.sh', 'os/bootfiles.sh', 'os/kpatches/*', 'os/kconfig/*') }}
      - name: scripts/ci-test.sh os-arm64
        run: scripts/ci-test.sh os-arm64

  metal-e2e:
    name: Bare-metal kernel end-to-end (metal/test.sh, non-blocking)
    if: github.event_name != 'push'
    # Not a gate: one check bounds latency under a CPU-hog storm, which nested virtualization may exceed.
    continue-on-error: true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/toolchains
        with:
          go: "true"
          qemu: "true"
      - name: scripts/ci-test.sh metal
        run: scripts/ci-test.sh metal

  dist:
    name: Build and test the release artifacts
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/toolchains
        with:
          go: "true"
          cross-arm64: "true"
      - name: scripts/dist.sh
        run: scripts/dist.sh --dev
      - name: scripts/ci-test.sh dist
        run: scripts/ci-test.sh dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  campaign:
    name: Chaos and soak campaigns (non-blocking)
    # Zero-error windows and flat resource trends over minutes: too sensitive to runner noise to gate.
    continue-on-error: true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/toolchains
      - name: scripts/ci-test.sh campaign
        run: scripts/ci-test.sh campaign
