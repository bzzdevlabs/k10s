# The VS Code extension (editors/vscode): build, test and package on changes to it or to the front ends it embeds;
# a `vscode-vX.Y.Z` tag on main publishes the .vsix as a GitHub release (never marked latest: that is k10s itself).
name: vscode

on:
  pull_request:
    paths: &paths
      - editors/vscode/**
      - crates/k10-lang/**
      - crates/k10-mesh/**
      - crates/k10-ir/**
      - .github/workflows/vscode.yml
  push:
    branches: [main]
    paths: *paths
    tags: ["vscode-v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vscode-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build, test, package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchains
      - name: wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: editors/vscode/build.sh
        run: editors/vscode/build.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: editors/vscode/dist/*.vsix
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/vscode-v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag
        run: |
          version=$(node -p 'require("./editors/vscode/package.json").version')
          if [[ "vscode-v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match editors/vscode/package.json version $version"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main"
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::release $GITHUB_REF_NAME already exists"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.vsix --repo "$GITHUB_REPOSITORY" --verify-tag --latest=false \
            --title "Ten & k10s for VS Code ${GITHUB_REF_NAME#vscode-v}" \
            --notes "Install: \`code --install-extension $(basename dist/*.vsix)\`. Changes: editors/vscode/CHANGELOG.md."
