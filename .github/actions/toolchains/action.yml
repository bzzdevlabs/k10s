# Toolchain pins for every workflow: Rust (+musl for x86-64, aarch64, i686 and armv7, +x86_64-unknown-none), GNU
# binutils, optional Go, QEMU/KVM, arm64 and armv7 tools.
name: k10s toolchains
description: Pinned Rust toolchain with the musl and x86_64-unknown-none targets; optional Go, QEMU/KVM, arm64 and armv7 tools
inputs:
  rust:
    description: Rust toolchain
    default: "1.98.1"
  binutils:
    description: GNU binutils version whose objdump the k10-jit encoder/SFI assurance tests run against
    default: "2.42"
  go:
    description: Install Go (benchmark tools) ("true" / "false")
    default: "false"
  go-version:
    description: Go version (bench/workloads/go.mod and bench/loadgen/go.mod need 1.25)
    default: "1.25.1"
  qemu:
    description: Install qemu-system-x86 and make /dev/kvm usable ("true" / "false")
    default: "false"
  cross-arm64:
    description: On x86-64, the aarch64 cross gcc and binutils and qemu-user (arm64 kernel, strip, version checks)
    default: "false"
  qemu-arm64:
    description: Install qemu-system-arm, AAVMF and dtc (arm64 guests)
    default: "false"
  cross-armv7:
    description: The armv7 (hard-float) cross gcc and binutils and qemu-user (armv7 kernel, strip, version checks)
    default: "false"
  qemu-armv7:
    description: Install qemu-system-arm and AAVMF32 (armv7 guests)
    default: "false"
runs:
  using: composite
  steps:
    - name: Rust ${{ inputs.rust }}
      shell: bash
      env:
        RUST: ${{ inputs.rust }}
      run: |
        rustup toolchain install "$RUST" --profile minimal --no-self-update
        rustup target add --toolchain "$RUST" x86_64-unknown-linux-musl x86_64-unknown-none aarch64-unknown-linux-musl \
          i686-unknown-linux-musl armv7-unknown-linux-musleabihf
        rustup default "$RUST"
        rustc -Vv
    - name: binutils ${{ inputs.binutils }}
      shell: bash
      env:
        BINUTILS: ${{ inputs.binutils }}
      run: |
        command -v objdump >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends binutils; }
        v=$(objdump --version | head -1)
        echo "$v"
        [[ $v == *" $BINUTILS"* ]] || { echo "::error::objdump is '$v', pinned $BINUTILS (.github/actions/toolchains)"; exit 1; }
    - name: Go ${{ inputs.go-version }}
      if: inputs.go == 'true'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ inputs.go-version }}
        cache: false
    - name: QEMU and KVM
      if: inputs.qemu == 'true'
      shell: bash
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q --no-install-recommends qemu-system-x86
        # Let the runner user open /dev/kvm.
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        ls -l /dev/kvm
        qemu-system-x86_64 --version
    - name: arm64 cross tools
      if: inputs.cross-arm64 == 'true'
      shell: bash
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q --no-install-recommends gcc-aarch64-linux-gnu qemu-user
        aarch64-linux-gnu-gcc --version | head -1
    - name: QEMU for arm64 guests
      if: inputs.qemu-arm64 == 'true'
      shell: bash
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q --no-install-recommends qemu-system-arm qemu-efi-aarch64 device-tree-compiler
        qemu-system-aarch64 --version
    - name: armv7 cross tools
      if: inputs.cross-armv7 == 'true'
      shell: bash
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q --no-install-recommends gcc-arm-linux-gnueabihf qemu-user
        arm-linux-gnueabihf-gcc --version | head -1
    - name: QEMU for armv7 guests
      if: inputs.qemu-armv7 == 'true'
      shell: bash
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q --no-install-recommends qemu-system-arm qemu-efi-arm
        qemu-system-arm --version
