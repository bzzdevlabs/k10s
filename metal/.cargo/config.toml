# Only applies when building for the bare-metal target (the host tool `mkbundle` is unaffected).
[target.x86_64-unknown-none]
# Non-PIE: the kernel is linked at a fixed physical address (1 MiB) and loaded there by QEMU's ELF loader, so no
# self-relocation is needed (the default for this target is a static PIE whose R_X86_64_RELATIVE relocations would
# have to be applied by us).
rustflags = ["-C", "relocation-model=static", "-C", "link-arg=--no-pie"]
