[package]
name = "k10-node"
description = "k10s hosted node runtime: shards, slots, coroutines, host API, HTTP ingress, KV"
version.workspace = true
edition.workspace = true

[dependencies]
k10-host = { workspace = true }
k10-ir = { workspace = true }
k10-mesh = { workspace = true }
libc = { workspace = true }

# k10-jit is built for the 64-bit targets only (its VmCtx assumes 64-bit pointers); 32-bit targets run the
# interpreter.
[target.'cfg(any(target_arch = "x86_64", target_arch = "aarch64"))'.dependencies]
k10-jit = { workspace = true }
