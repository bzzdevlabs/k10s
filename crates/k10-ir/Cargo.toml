[package]
name = "k10-ir"
description = "TIR: types, codec, validator, reference interpreter"
version.workspace = true
edition.workspace = true

[features]
default = ["std"]
# Uses std (hardware sqrt, std::error::Error impls). Without it the crate is no_std + alloc.
std = []
# Random valid-program generator (`k10_ir::gen`) for differential testing. Always compiled for this crate's tests.
gen = ["std"]

[dependencies]
k10-nospec = { path = "../k10-nospec" }
