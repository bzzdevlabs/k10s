apiVersion: apps/v1
kind: Deployment
metadata: {name: compute}
spec:
  replicas: 1
  selector: {matchLabels: {app: compute}}
  template:
    metadata: {labels: {app: compute}}
    spec:
      containers:
      - name: compute
        image: k10s-bench/compute:v1
        imagePullPolicy: Never
        ports: [{containerPort: 8080}]
---
apiVersion: v1
kind: Service
metadata: {name: compute}
spec:
  type: NodePort
  selector: {app: compute}
  ports: [{port: 8080, targetPort: 8080, nodePort: 30082}]
