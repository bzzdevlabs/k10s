apiVersion: apps/v1
kind: Deployment
metadata: {name: echo}
spec:
  replicas: @@REPLICAS@@
  selector: {matchLabels: {app: echo}}
  template:
    metadata: {labels: {app: echo}}
    spec:
      containers:
      - name: echo
        image: k10s-bench/echo:v1
        imagePullPolicy: Never
        ports: [{containerPort: 8080}]
---
apiVersion: v1
kind: Service
metadata: {name: echo}
spec:
  type: NodePort
  selector: {app: echo}
  ports: [{port: 8080, targetPort: 8080, nodePort: 30080}]
