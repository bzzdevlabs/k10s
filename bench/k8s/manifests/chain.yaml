apiVersion: apps/v1
kind: Deployment
metadata: {name: chain}
spec:
  replicas: 1
  selector: {matchLabels: {app: chain}}
  template:
    metadata: {labels: {app: chain}}
    spec:
      containers:
      - name: chain
        image: k10s-bench/chain:v1
        imagePullPolicy: Never
        env: [{name: BACKEND_URL, value: "http://echo.default.svc.cluster.local:8080/"}]
        ports: [{containerPort: 8080}]
---
apiVersion: v1
kind: Service
metadata: {name: chain}
spec:
  type: NodePort
  selector: {app: chain}
  ports: [{port: 8080, targetPort: 8080, nodePort: 30081}]
